name: Documentation site

# Publishes https://akinzou.github.io/TradeLockerBot/ from the commit CI
# validated, as docker-image.yml publishes the image (ADR 0031). The same
# strict build already ran in CI's docs job, so a broken link never gets here.
on:
  workflow_run:
    # Must match the `name:` of python-package.yml exactly.
    workflows: ["Python (3.11, 3.12) ,"]
    types:
      - completed

permissions:
  contents: read

jobs:
  # Runs the pip-installed build tools, so it holds no write access; the
  # deploy job below gets that, and runs only GitHub's own action.
  build:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      # Checking out workflow_run.head_sha is safe only because the job-level
      # `if` admits master push and dispatch runs alone: code from fork pull requests
      # never reaches this job or the deploy after it.
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the site's build tools
        run: python -m pip install --require-hashes -r requirements-docs.txt
      - name: Build the site
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Concurrency on this job alone: on the workflow, every CI run, a pull
  # request's too, would join the group, and the newest pending run cancels
  # the one before it, a master deploy among them. Never cancelled halfway.
  # deploy-pages labels the deployment with the tip of master when the run
  # started, which can be a later commit than the one built (ADR 0031).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
