# The workflow name is referenced by docker-image.yml (workflow_run trigger).
# Renaming it without updating that trigger silently stops image publishing.
name: Python (3.11, 3.12) ,

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The lock first, as the image installs it, so the tests run against
          # the image's versions. The dev tools come after and may not move a
          # locked package; the next step fails if one did. --no-deps as in
          # the image: the lock overrides the client's own pins (ADR 0017).
          python -m pip install --require-hashes --no-deps -r requirements-lock.txt
          python -m pip install -r requirements-dev.txt
      - name: Check the locked versions survived the dev install
        run: python -m tests.dependency_lock
      # What pip's resolver checked before --no-deps: every requirement of a
      # locked package is locked, and every override is honoured and needed.
      # Markers are read for this leg's Python; the docker-build job checks
      # the image itself.
      - name: Check the lock holds what its packages need
        run: python -m tests.dependency_closure
      - name: Lint (syntax errors and undefined names)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test
        run: python -m pytest

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install semgrep==1.185.0
      - name: Blocking scan (ERROR severity)
        run: >
          semgrep scan --config p/python --config p/security-audit --config p/secrets --config p/github-actions
          --metrics=off --severity ERROR --error .
      - name: Report-only scan (WARNING and INFO severity)
        run: |
          semgrep scan --config p/python --config p/security-audit --config p/secrets --config p/github-actions \
            --metrics=off --severity WARNING --severity INFO --text-output=findings.txt .
          {
            echo "### Semgrep non-blocking findings"
            echo '```'
            cat findings.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image without publishing
        run: docker build -t tradelocker_bot:ci .
      # Tests import from the repository root on the runner's Python; the image
      # runs from /app on its own Python. Loading the entrypoint inside the image
      # (argparse --help exits before any login) catches packaging gaps the tests cannot.
      - name: Smoke-run the entrypoint inside the image
        run: docker run --rm --entrypoint python tradelocker_bot:ci main_without_ssl.py --help
      # The image's own start command, which no test runs (ADR 0018). Without
      # a network, so nothing here can reach a broker. Without a password the
      # bot must stop before any output, naming the variable it lacks.
      - name: Start the image without a password
        run: |
          status=0
          docker run --rm --network none -e username=u -e server=s -e env=demo \
            tradelocker_bot:ci > out.txt 2> err.txt || status=$?
          cat out.txt err.txt
          test "$status" = 2
          test ! -s out.txt
          tail -n 1 err.txt | grep -q 'error: the password environment variable is not set or is empty$'
      # A password the old shell form split and globbed must get past the
      # settings: the greeting is printed, then the login fails for want of
      # a network. The old image stopped at the settings with status 2.
      - name: Start the image with a password that has spaces and shell characters
        run: |
          status=0
          docker run --rm --network none -e username=u -e 'password=p a $HOME *' -e server=s -e env=demo \
            tradelocker_bot:ci > out.txt 2> err.txt || status=$?
          cat out.txt err.txt
          test "$status" != 0
          test "$status" != 2
          grep -qF '|_   _| __ __ _' out.txt
      # The image installs with --no-deps (ADR 0017), so check there, with the
      # image's own interpreter reading the markers, that it holds what its
      # packages need. It uses the base image's own packaging, so nothing
      # outside the lock is added.
      - name: Check the image holds what its packages need
        run: docker run --rm --entrypoint python tradelocker_bot:ci -m tests.dependency_closure
      # The image must add exactly the locked set to its base; with the fitness tests tying
      # the lock to requirements.txt and to the broker fake's client version,
      # this also proves the image runs the characterized client.
      - name: Check the image's packages against the lock
        run: |
          base="$(sed -n 's/^FROM \([^ ]*\).*/\1/p' Dockerfile)"
          docker run --rm --entrypoint python "$base" -m pip freeze --all > base.txt
          docker run --rm --entrypoint python tradelocker_bot:ci -m pip freeze --all > installed.txt
          python3 -m tests.dependency_lock --freeze installed.txt --base base.txt --exact
      # The tests check the base image's tag against the lock, but Docker reads
      # only the digest (ADR 0019): check the interpreter the image runs.
      - name: Check the image runs the Python the lock was compiled for
        run: |
          want="$(sed -n 's/.*--python-version \([0-9.]*\).*/\1/p' requirements-lock.txt)"
          have="$(docker run --rm --entrypoint python tradelocker_bot:ci -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          echo "lock: $want, image: $have"
          test -n "$want"
          test "$have" = "$want"
      # A base-image fix now arrives only as a digest bump (ADR 0019).
      # Dependabot proposes one; this warns on every run once the tag has
      # moved past the pin, in case it does not. A warning, not a failure:
      # the tag moves without any commit here, and would block every pull
      # request until the bump is merged.
      - name: Warn when the base image's tag has moved past the pin
        run: |
          base="$(sed -n 's/^FROM \([^ ]*\).*/\1/p' Dockerfile)"
          tag="${base%@*}"
          pinned="${base#*@}"
          if ! current="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"; then
            echo "::warning file=Dockerfile::Could not read the current digest of $tag"
          elif [ "$current" != "$pinned" ]; then
            echo "::warning file=Dockerfile::$tag is now $current; the image is pinned to $pinned. Bump the digest (ADR 0019)."
          else
            echo "$tag is still $pinned"
          fi

  # Single required status check for master. Aggregating here means branch
  # protection does not need editing every time a job is added or renamed.
  ci-ok:
    if: always()
    needs: [ tests, semgrep, docker-build ]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every gate passed
        run: |
          test "${{ needs.tests.result }}" = "success"
          test "${{ needs.semgrep.result }}" = "success"
          test "${{ needs.docker-build.result }}" = "success"
