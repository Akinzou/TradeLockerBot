# The workflow name is referenced by docker-image.yml (workflow_run trigger).
# Renaming it without updating that trigger silently stops image publishing.
name: Python (3.11, 3.12) ,

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint (syntax errors and undefined names)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test
        run: python -m pytest

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install semgrep==1.185.0
      - name: Blocking scan (ERROR severity)
        run: >
          semgrep scan --config p/python --config p/security-audit --config p/secrets --config p/github-actions
          --metrics=off --severity ERROR --error .
      - name: Report-only scan (WARNING and INFO severity)
        run: |
          semgrep scan --config p/python --config p/security-audit --config p/secrets --config p/github-actions \
            --metrics=off --severity WARNING --severity INFO --text-output=findings.txt .
          {
            echo "### Semgrep non-blocking findings"
            echo '```'
            cat findings.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image without publishing
        run: docker build -t tradelocker_bot:ci .

  # Single required status check for master. Aggregating here means branch
  # protection does not need editing every time a job is added or renamed.
  ci-ok:
    if: always()
    needs: [ tests, semgrep, docker-build ]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every gate passed
        run: |
          test "${{ needs.tests.result }}" = "success"
          test "${{ needs.semgrep.result }}" = "success"
          test "${{ needs.docker-build.result }}" = "success"
