[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

# A floor rather than the measured figure, so the README's fixed badge, which
# states it, stays true without a service redrawing it after each run; a test
# ties the two (ADR 0030). Below the measured 99.62%: the lines left out are a
# defensive raise and a failed read of an error's body, not worth pins.
[tool.coverage.run]
branch = true
source = ["tradelocker_bot"]

[tool.coverage.report]
fail_under = 99
precision = 2
show_missing = true
skip_covered = true
